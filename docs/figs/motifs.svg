<text x="70" y="214" font-size="16" fill="#3F6B4A" font-weight="500" text-anchor="start" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">覆盖率 100%</text>
<text x="70" y="234" font-size="12" fill="#6B6259" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">无「无解」项</text>
