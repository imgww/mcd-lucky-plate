<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
<title id="t">餐品幸运清单</title>
<desc id="d">154 项餐品全收录，共 215 条寓意</desc>
<rect width="960" height="400" fill="#F7F4EC"/>
<text x="48" y="42" font-size="19" fill="#241F1A" font-weight="500" text-anchor="start" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">餐品幸运清单：先穷举全部餐品，再由主题挑选</text>
<text x="48" y="64" font-size="12" fill="#6B6259" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">早期版本只有主题词库，导致未被任何主题用到的餐品没有寓意——清单把方向反过来</text>
<rect x="48" y="94" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#D8D0C2"/>
<text x="70" y="148" font-size="52" fill="#A8271F" font-weight="500" text-anchor="start" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">154</text>
