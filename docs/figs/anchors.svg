<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
<title id="t">谐音锚点核验</title>
<desc id="d">50 条谐音锚点全部在真实菜单中命中</desc>
<rect width="960" height="300" fill="#F7F4EC"/>
<text x="48" y="44" font-size="19" fill="#241F1A" font-weight="500" text-anchor="start" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">谐音锚点 × 真实菜单：50/ 50 全部命中</text>
<text x="48" y="66" font-size="12" fill="#6B6259" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">每个梗都必须能回答「它对应菜单上哪一道菜」，答不上来就不算梗</text>
